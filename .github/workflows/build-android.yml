name: Build Android APK
on:
  push:
    branches: [ dev ]
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 33
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;26.3.11579264"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          target: android
          arch: android_arm64_v8a
          modules: 'qt5compat qtshadertools qtimageformats qtmultimedia qtremoteobjects'

      - name: Install Go and gomobile
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Install CMake
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.25.3/cmake-3.25.3-linux-x86_64.sh
          chmod +x cmake-3.25.3-linux-x86_64.sh
          sudo ./cmake-3.25.3-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Configure
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          $QT_ROOT_DIR/bin/qt-cmake . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=$QT_HOST_PATH \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON

      - name: Build
        run: cmake --build build-android --parallel

      - name: Sign APK
        run: |
          APK=$(find build-android -name "*.apk" | head -1)
          echo "Found APK: $APK"
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out signed.apk \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-android
          path: signed.apk
