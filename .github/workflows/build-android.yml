name: Build Android APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 33
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          target: android
          arch: android_arm64_v8a
          modules: 'qt5compat qtshadertools qtimageformats qtmultimedia qtremoteobjects'

      - name: Install Go and gomobile
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Install CMake
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.25.3/cmake-3.25.3-linux-x86_64.sh
          chmod +x cmake-3.25.3-linux-x86_64.sh
          sudo ./cmake-3.25.3-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Find qt-cmake
        run: find /home/runner/work -name "qt-cmake" 2>/dev/null

      - name: Configure
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          $QT_ROOT_DIR/bin/qt-cmake . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=$QT_HOST_PATH \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON

      - name: Build
        run: cmake --build build-android --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-android
          path: build-android/**/*.apk
